[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "An Obsidian-style second brain for AI coding agents, exposed as an MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/larkkkz/Agent-Second-Brain"

[project.scripts]
second-brain-mcp = "second_brain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["second_brain_mcp"]
